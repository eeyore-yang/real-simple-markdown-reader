name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RealSimpleMD.apk

      # Publish the APK as the "latest" release, replacing the previous one,
      # so it can always be downloaded from the same URL without unzipping.
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RealSimpleMD.apk \
            --target "$GITHUB_SHA" \
            --title "Real Simple MD editor (latest build)" \
            --notes "Built from \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`. Download RealSimpleMD.apk below and install it."
